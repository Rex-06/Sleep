<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SleepDiary">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>SleepDiary</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#151923;--muted:#737887;--accent:#4f46e5;--line:#e8e9ef;--good:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:92px}
header{padding:calc(18px + env(safe-area-inset-top)) 20px 14px;background:var(--card);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:28px;margin:0;font-weight:750}.sub{color:var(--muted);margin-top:4px}
main{max-width:680px;margin:auto;padding:18px}
.card{background:var(--card);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 2px 16px #1118270a}
.hero{text-align:center;background:linear-gradient(145deg,#eef0ff,#fff)}
.hero .big{font-size:54px;font-weight:800;letter-spacing:-2px;margin:8px 0}
.badge{display:inline-block;padding:6px 11px;border-radius:99px;background:#e9edff;color:var(--accent);font-weight:650;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#f7f7fa;border-radius:17px;padding:15px}.metric b{font-size:20px;display:block;margin-top:4px}.balance-positive{color:var(--good)}.balance-negative{color:var(--bad)}.muted{color:var(--muted)}
button{border:0;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:white;width:100%}.secondary{background:#eef0f5;color:var(--text)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:10}.nav button{background:none;color:var(--muted);flex:1;max-width:140px;padding:8px}.nav button.active{color:var(--accent)}
.section-title{font-size:18px;font-weight:750;margin:22px 2px 12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
input,textarea,select{width:100%;padding:13px;border:1px solid #dfe1e8;border-radius:13px;background:#fff;font:inherit;margin-top:6px}.field{margin-bottom:15px}label{font-weight:650;font-size:14px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{margin-top:0}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:5px}.day{min-height:62px;border:1px solid var(--line);border-radius:11px;padding:6px;text-align:center;background:#fff;transition:box-shadow .2s,transform .2s}.day.today{box-shadow:0 4px 14px #6b728055, inset 0 0 0 1px #9ca3af;transform:translateY(-1px)}.day .num{font-weight:700}.day .hours{font-size:10px;margin-top:5px;font-weight:700}.green{color:var(--good)}.orange{color:var(--warn)}.red{color:var(--bad)}
.bar{height:9px;background:#ececf2;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent);border-radius:9px}
.empty{text-align:center;padding:36px 15px;color:var(--muted)}
.week-widget{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}.week-day{text-align:center;font-size:11px;color:var(--muted);border-radius:16px;padding:4px 2px;transition:box-shadow .2s,background .2s}.week-day.today{background:#f0f1f3;box-shadow:0 4px 14px #6b728055, inset 0 0 0 1px #9ca3af}.week-day.today .week-dot{box-shadow:0 0 0 1px #6b7280, 0 3px 9px #6b728055}.week-dot{height:42px;border-radius:13px;margin:5px 0 4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1px solid var(--line);background:#f7f7fa;color:var(--muted)}.week-dot.green{background:#dcfce7;color:#166534;border-color:#bbf7d0}.week-dot.orange{background:#ffedd5;color:#9a3412;border-color:#fed7aa}.week-dot.red{background:#fee2e2;color:#991b1b;border-color:#fecaca}.week-dot.target{box-shadow:inset 0 0 0 2px var(--accent)}
.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;padding:10px 11px;font-size:14px}.danger{background:#fee2e2;color:#991b1b}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}

small{color:var(--muted)}
</style>
</head>
<body>
<header><h1 id="title">Mi sueño</h1><div class="sub" id="subtitle"></div></header>
<main id="app"></main>
<nav class="nav">
<button data-tab="home" onclick="showTab('home')">⌂<br><small>Inicio</small></button>
<button data-tab="calendar" onclick="showTab('calendar')">▦<br><small>Calendario</small></button>
<button data-tab="stats" onclick="showTab('stats')">▥<br><small>Estadísticas</small></button>
</nav>

<div class="modal" id="modal">
<div class="sheet">
<h2>Registrar sueño</h2>
<div class="field"><label>Me acosté</label><input id="bed" type="datetime-local"></div>
<div class="field"><label>Me levanté</label><input id="wake" type="datetime-local"></div>
<div class="field"><label>Nota (opcional)</label><textarea id="note" rows="3" placeholder="¿Cómo dormiste?"></textarea></div>
<button class="primary" onclick="saveEntry()">Guardar</button>
<button class="secondary" style="width:100%;margin-top:9px" onclick="closeModal()">Cancelar</button>
</div></div>

<script>
const KEY='sleepdiary.entries.v1', TARGET='sleepdiary.target.v1';
let entries=JSON.parse(localStorage.getItem(KEY)||'[]'); let target=Number(localStorage.getItem(TARGET)||480);
let tab='home', month=new Date(); month.setDate(1);

const fmtDate=d=>new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short'}).format(new Date(d));
const fmtTime=d=>new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit'}).format(new Date(d));
const mins=e=>Math.max(0,Math.round((new Date(e.wake)-new Date(e.bed))/60000));
const dur=m=>`${Math.floor(m/60)}h ${m%60}m`;
const sorted=()=>entries.sort((a,b)=>new Date(b.bed)-new Date(a.bed));
function quality(m){return m>=420?'green':m>=360?'orange':'red'}
function dayKey(d){let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function sleepDayKey(e){return dayKey(e.bed)}
function balanceLabel(m){return (m>=0?'+':'−')+dur(Math.abs(m))}
function balanceClass(m){return m>=0?'balance-positive':'balance-negative'}
function showTab(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function render(){document.getElementById('subtitle').textContent=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date()); if(tab==='home')home(); if(tab==='calendar')calendar(); if(tab==='stats')stats()}
function home(){
let e=sorted()[0]; document.getElementById('title').textContent='Mi sueño';
// La semana de la pantalla principal siempre va de lunes a domingo.
let now=new Date(), startDay=new Date(now); startDay.setHours(0,0,0,0);
let mondayOffset=(startDay.getDay()+6)%7; startDay.setDate(startDay.getDate()-mondayOffset);
let weekDays=Array.from({length:7},(_,i)=>{let d=new Date(startDay);d.setDate(startDay.getDate()+i);return d;});
let weekHtml=weekDays.map(d=>{let eDay=entries.find(x=>sleepDayKey(x)===dayKey(d));let label=new Intl.DateTimeFormat('es-ES',{weekday:'short'}).format(d).replace('.','').toUpperCase();return `<div class="week-day ${dayKey(d)===dayKey(now)?'today':''}"><div>${label}</div><div class="week-dot ${eDay?quality(mins(eDay)):'empty'} ${eDay&&mins(eDay)>=target?'target':''}">${eDay?dur(mins(eDay)).replace(' ','<br>'):'—'}</div><small>${d.getDate()}</small></div>`}).join('');
let weekEntries=weekDays.map(d=>entries.find(x=>sleepDayKey(x)===dayKey(d))).filter(Boolean); let weekBalance=weekEntries.reduce((sum,x)=>sum+(mins(x)-target),0);
document.getElementById('app').innerHTML=`<div class="card hero">${e?`<span class="badge">Última noche</span><div class="big">${dur(mins(e))}</div><div class="muted">${fmtDate(e.bed)} · ${fmtTime(e.bed)} → ${fmtTime(e.wake)}</div><div class="actions"><button class="secondary" onclick="editEntry('${e.id}')">✎ Editar</button><button class="danger" onclick="deleteEntry('${e.id}')">Eliminar</button></div>`:`<div style="font-size:48px">🌙</div><h2>Aún no hay registros</h2><p class="muted">Añade tu primera noche para empezar.</p>`}</div>
<div class="grid"><div class="metric">Objetivo<b>${dur(target)}</b></div><div class="metric">Diferencia del día<b class="${e?balanceClass(mins(e)-target):''}">${e?balanceLabel(mins(e)-target):'—'}</b></div></div>
<div class="card" style="margin-top:16px"><h3 style="margin-top:0">Esta semana · lunes a domingo</h3><div class="week-widget">${weekHtml}</div><div class="grid" style="margin-top:16px"><div class="metric"><span>Balance semanal</span><b class="${balanceClass(weekBalance)}">${weekEntries.length?balanceLabel(weekBalance):'—'}</b></div><div class="metric"><span>Noches registradas</span><b>${weekEntries.length}/7</b></div></div><small class="muted" style="display:block;margin-top:12px">Balance = sueño registrado − objetivo. Positivo = has dormido por encima del objetivo; negativo = déficit.</small><div class="legend"><span>🟢 ≥ 7 h</span><span>🟠 6–7 h</span><span>🔴 &lt; 6 h</span><span>🔵 objetivo alcanzado</span></div><small class="muted">Cada registro pertenece al día en que te acuestas, aunque te levantes al día siguiente.</small></div>
<div class="card"><button class="primary" onclick="openModal()">＋ Registrar sueño</button></div>
${e?`<div class="section-title">Últimos registros</div><div class="card">${sorted().slice(0,7).map(row).join('')}</div>`:''}`;
}
function row(e){return `<div class="row"><div><b>${fmtDate(e.bed)}</b><br><small>${fmtTime(e.bed)} → ${fmtTime(e.wake)}${e.note?` · ${e.note}`:''}</small></div><div style="text-align:right"><b class="${quality(mins(e))}">${dur(mins(e))}</b><div class="actions"><button class="secondary" onclick="editEntry('${e.id}')">Editar</button><button class="danger" onclick="deleteEntry('${e.id}')">Borrar</button></div></div></div>`}
function calendar(){
document.getElementById('title').textContent='Calendario'; let y=month.getFullYear(),m=month.getMonth(); let first=new Date(y,m,1), days=new Date(y,m+1,0).getDate(), offset=(first.getDay()+6)%7;
let cells=Array(offset).fill('').concat(Array.from({length:days},(_,i)=>i+1)); while(cells.length%7)cells.push('');
let cellsHtml=cells.map(d=>{if(!d)return '<div></div>';let date=new Date(y,m,d),e=entries.find(x=>dayKey(x.bed)===dayKey(date));return `<div class="day ${dayKey(date)===dayKey(new Date())?'today':''}" onclick="${e?`selectDay('${e.id}')`:''}"><div class="num">${d}</div>${e?`<div class="hours ${quality(mins(e))}">${dur(mins(e))}</div><small>Editar</small>`:'<div class="hours muted">—</div>'}</div>`}).join('');
document.getElementById('app').innerHTML=`<div class="card"><div class="calendar-head"><button class="secondary" onclick="changeMonth(-1)">‹</button><b>${new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(month)}</b><button class="secondary" onclick="changeMonth(1)">›</button></div><div class="calendar-grid">${['L','M','X','J','V','S','D'].map(x=>`<div class="dow">${x}</div>`).join('')}${cellsHtml}</div><div class="legend"><span>🟢 ≥ 7 h</span><span>🟠 6–7 h</span><span>🔴 &lt; 6 h</span></div></div><div class="card"><b>Toca un día con registro</b><p class="muted" style="margin-bottom:0">Podrás ver sus horas y editar o borrar el registro.</p></div>`;
}
function changeMonth(n){month.setMonth(month.getMonth()+n);render()}
function selectDay(id){let e=entries.find(x=>x.id===id);if(!e)return;let action=prompt(`${fmtDate(e.bed)}\n${fmtTime(e.bed)} → ${fmtTime(e.wake)}\nDuración: ${dur(mins(e))}${e.note?'\nNota: '+e.note:''}\n\nEscribe E para editar, B para borrar o C para cancelar.`,'C');if(action?.toUpperCase()==='E')editEntry(id);if(action?.toUpperCase()==='B')deleteEntry(id)}
function editEntry(id){let e=entries.find(x=>x.id===id);if(!e)return;document.getElementById('bed').value=localISO(new Date(e.bed));document.getElementById('wake').value=localISO(new Date(e.wake));document.getElementById('note').value=e.note||'';document.getElementById('modal').dataset.editId=id;document.querySelector('#modal h2').textContent='Editar sueño';document.querySelector('#modal .primary').textContent='Guardar cambios';document.getElementById('modal').classList.add('show')}
function deleteEntry(id){let e=entries.find(x=>x.id===id);if(!e)return;if(confirm(`¿Borrar el registro del ${fmtDate(e.bed)}?`)){entries=entries.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(entries));render()}}
function stats(){
document.getElementById('title').textContent='Estadísticas';let a=sorted().slice(0,30),avg=a.length?Math.round(a.reduce((s,e)=>s+mins(e),0)/a.length):0,best=a.length?Math.max(...a.map(mins)):0,worst=a.length?Math.min(...a.map(mins)):0,total=a.reduce((s,e)=>s+mins(e),0),pct=Math.min(100,Math.round(avg/target*100)),totalBalance=entries.reduce((s,e)=>s+(mins(e)-target),0);
document.getElementById('app').innerHTML=`<div class="card"><h3>Últimos 30 registros</h3><div class="row"><span>Promedio</span><b>${a.length?dur(avg):'—'}</b></div><div class="row"><span>Total</span><b>${dur(total)}</b></div><div class="row"><span>Noches registradas</span><b>${a.length}</b></div></div><div class="card"><h3>Balance acumulado total</h3><div class="metric"><span>Desde el primer registro</span><b class="${entries.length?balanceClass(totalBalance):''}">${entries.length?balanceLabel(totalBalance):'—'}</b></div><small class="muted" style="display:block;margin-top:10px">Suma de todas las diferencias respecto a tu objetivo de ${dur(target)}. Positivo = superávit; negativo = déficit.</small></div>${a.length?`<div class="card"><h3>Promedio frente a objetivo</h3><div class="bar"><span style="width:${pct}%"></span></div><p class="muted">${pct}% de tu objetivo de ${dur(target)}</p></div>`:''}<div class="card"><h3>Objetivo</h3><div class="row"><span>Sueño objetivo</span><b>${dur(target)}</b></div><button class="secondary" style="width:100%" onclick="setTarget()">Cambiar objetivo</button></div>`;
}
function setTarget(){let h=prompt('Objetivo de sueño en horas (por ejemplo, 8)',target/60);if(h!==null){let n=Math.round(Number(h)*60);if(n>=240&&n<=720){target=n;localStorage.setItem(TARGET,target);render()}}}
function openModal(){document.getElementById('modal').dataset.editId='';document.querySelector('#modal h2').textContent='Registrar sueño';document.querySelector('#modal .primary').textContent='Guardar';let now=new Date(),wake=new Date(now),bed=new Date(now);bed.setDate(bed.getDate()-1);bed.setHours(0,0,0,0);document.getElementById('bed').value=localISO(bed);document.getElementById('wake').value=localISO(wake);document.getElementById('note').value='';document.getElementById('modal').classList.add('show')}
function localISO(d){let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveEntry(){let bed=new Date(document.getElementById('bed').value),wake=new Date(document.getElementById('wake').value),note=document.getElementById('note').value.trim();if(isNaN(bed)||isNaN(wake)||wake<=bed){alert('Revisa las horas.');return}let editId=document.getElementById('modal').dataset.editId;if(editId){let e=entries.find(x=>x.id===editId);if(e){e.bed=bed.toISOString();e.wake=wake.toISOString();e.note=note}}else{entries.push({id:crypto.randomUUID(),bed:bed.toISOString(),wake:wake.toISOString(),note})}localStorage.setItem(KEY,JSON.stringify(entries));closeModal();render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
showTab('home');
</script>
</body></html>
